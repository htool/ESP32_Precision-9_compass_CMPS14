; PlatformIO Project Configuration File
; SensESP HWT901B-TTL compass for Sailor Hat ESP32
; https://docs.platformio.org/page/projectconf.html

[platformio]
; shesp32: SH-ESP32 / ESP32-WROOM, Arduino + pioarduino (HTTP Signal K).
; shesp32_espidf: same board with TLS-capable mbedTLS (needed if SK is https).
default_envs = shesp32

[env]
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    SignalK/SensESP @ ^3.5.0
    ttlappalainen/NMEA2000-library
    NMEA2000_twai=https://github.com/skarlsson/NMEA2000_twai.git

build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D USE_ESP_IDF_LOG

board_build.partitions = min_spiffs.csv

build_unflags =
    -Werror=reorder
monitor_filters = esp32_exception_decoder

test_build_src = true
extra_scripts = pre:include_secrets.py

;; After the first USB upload, uncomment to flash over Wi-Fi:
;upload_protocol = espota
;upload_port = 192.168.3.x
;upload_flags =
;    --auth=thisisfine

[pioarduino]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
lib_deps =
    ${env.lib_deps}
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip
build_flags =
    ${env.build_flags}
    -D SENSESP_SSL_SUPPORT=1

[esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BUTTON_BUILTIN=0
    -D LED_BUILTIN=2

[env:shesp32]
extends = pioarduino, esp32
build_flags =
    ${pioarduino.build_flags}
    ${esp32.build_flags}

[env:shesp32_espidf]
extends = env:shesp32
framework = espidf, arduino
lib_deps =
    ${env.lib_deps}
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
